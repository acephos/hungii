name: Publish Android preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'acephos/hungii'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          tag=os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+',tag),'Use a vX.Y.Z tag.'
          assert subprocess.check_output(['git','rev-parse',tag+'^{commit}']).strip()==subprocess.check_output(['git','rev-parse','HEAD']).strip()
          subprocess.run(['git','merge-base','--is-ancestor','HEAD','origin/main'],check=True)
          source=Path('android-prototype/app/build.gradle.kts').read_text()
          version=re.search(r'getOrElse\("(\d+\.\d+(?:\.\d+)?)[^"]*"\)',source).group(1)
          if version.count('.')==1:version+='.0'
          assert tag=='v'+version,'Update the app version before tagging.'
          PY
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure public Android service settings
        run: python3 scripts/ci/android-config.py
        env:
          HUNGII_REQUIRE_CONFIG: 'true'
          HUNGII_SUPABASE_URL: ${{ vars.HUNGII_SUPABASE_URL }}
          HUNGII_SUPABASE_PUBLISHABLE_KEY: ${{ vars.HUNGII_SUPABASE_PUBLISHABLE_KEY }}
          HUNGII_WORKOS_CLIENT_ID: ${{ vars.HUNGII_WORKOS_CLIENT_ID }}
          HUNGII_DEMO_API_URL: ${{ vars.HUNGII_DEMO_API_URL }}
      - name: Restore stable preview signing key
        env:
          PREVIEW_KEYSTORE: ${{ secrets.HUNGII_PREVIEW_KEYSTORE_B64 }}
          EXPECTED_PREVIEW_CERT: ${{ vars.HUNGII_PREVIEW_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import os,base64,hashlib,subprocess
          from pathlib import Path
          value=os.environ.get('PREVIEW_KEYSTORE')
          assert value,'Configure HUNGII_PREVIEW_KEYSTORE_B64 before publishing.'
          key=Path(os.environ['RUNNER_TEMP'])/'hungii-preview.keystore'
          key.parent.mkdir(parents=True,exist_ok=True)
          key.write_bytes(base64.b64decode(value,validate=True));key.chmod(0o600)
          cert=subprocess.check_output(['keytool','-exportcert','-keystore',str(key),'-alias','androiddebugkey','-storepass','android'])
          assert hashlib.sha256(cert).hexdigest()==os.environ['EXPECTED_PREVIEW_CERT'],'Restored preview key has an unexpected certificate.'
          with open(os.environ['GITHUB_ENV'],'a') as env:
            env.write(f'HUNGII_PREVIEW_KEYSTORE_PATH={key}\n')
          PY
      - name: Check and test backend
        run: |
          python3 scripts/check-repo.py
          python3 scripts/generate-brand.py --check
          python3 -m py_compile demo/agent.py scripts/demo-services.py
          npx --yes deno@2.9.6 check --config supabase/functions/deno.json supabase/functions/hungii-api/index.ts demo/gateway.ts
          npx --yes deno@2.9.6 test --config supabase/functions/deno.json --allow-env supabase/functions/_shared/ demo/simulator_test.ts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demo/requirements-agent.txt
      - name: Test cloud Assistant without inference
        run: |
          python -m pip install -r demo/requirements-agent.txt
          python -m unittest demo.agent_test -v
      - name: Build and lint signed previews
        working-directory: android-prototype
        run: ./gradlew --no-daemon -PhungiiVersionName="${RELEASE_TAG#v}" :app:testRealDebugUnitTest :app:testDemoDebugUnitTest :app:assembleRealDebug :app:assembleDemoDebug :app:lintRealDebug :app:lintDemoDebug
      - name: Package and verify APKs
        env:
          EXPECTED_PREVIEW_CERT: ${{ vars.HUNGII_PREVIEW_CERT_SHA256 }}
        run: |
          mkdir -p release-artifacts
          cp android-prototype/app/build/outputs/apk/real/debug/app-real-debug.apk release-artifacts/hungii.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release-artifacts/hungii.apk
          python3 scripts/ci/verify-preview-certificate.py release-artifacts/hungii.apk
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/hungii-release-notes.md" <<'NOTES'
          Install hungii.apk — the single user-facing Hungii app. Android 8+ is required. The stable development signing key supports updates to the existing Hungii preview.

          Continuous fork-h logo and wordmark, Android adaptive and wallpaper-themed icons, crimson dark theme, encrypted local tracker, optional profile sync, simplified delivery settings, and a prepared Swiggy basket/payment/tracking flow with checkout recovery.

          Swiggy connection and real ordering remain gated until developer access and staging verification are complete. This release does not enable live payments. UPI authorization happens in the user's UPI app. WorkOS remains staging. The Simulator is a developer testing build and is no longer published as a second user APK.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Hungii $RELEASE_TAG · Android preview" --notes-file "$RUNNER_TEMP/hungii-release-notes.md"
          fi
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hungii-preview.keystore"

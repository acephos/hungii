name: Check Android and backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android
        run: python3 scripts/ci/android-config.py
        env:
          HUNGII_SUPABASE_URL: ${{ vars.HUNGII_SUPABASE_URL }}
          HUNGII_SUPABASE_PUBLISHABLE_KEY: ${{ vars.HUNGII_SUPABASE_PUBLISHABLE_KEY }}
          HUNGII_WORKOS_CLIENT_ID: ${{ vars.HUNGII_WORKOS_CLIENT_ID }}
          HUNGII_DEMO_API_URL: ${{ vars.HUNGII_DEMO_API_URL }}
      - name: Check, lint and test backend (no live services)
        run: |
          python3 scripts/check-repo.py
          python3 scripts/generate-brand.py --check
          python3 -m py_compile demo/agent.py scripts/demo-services.py
          npx --yes deno@2.9.6 fmt --check supabase/functions demo scripts
          npx --yes deno@2.9.6 lint --config supabase/functions/deno.json supabase/functions demo scripts
          npx --yes deno@2.9.6 check --config supabase/functions/deno.json supabase/functions/hungii-api/index.ts demo/gateway.ts scripts/operator.ts
          npx --yes deno@2.9.6 test --config supabase/functions/deno.json --allow-env supabase/functions/ demo/simulator_test.ts scripts/
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      - name: Apply migrations and run SQL tests (disposable local database)
        run: |
          supabase db start
          for test in supabase/tests/*.sql; do
            echo "::group::$test"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f "$test"
            echo "::endgroup::"
          done
          supabase stop --no-backup
      - name: Format, test, build and lint Android
        working-directory: android-prototype
        run: ./gradlew --no-daemon spotlessCheck :app:testRealDebugUnitTest :app:testDemoDebugUnitTest :app:assembleRealDebug :app:assembleDemoDebug :app:assembleRealRelease :app:lintRealDebug :app:lintDemoDebug :app:lintRealRelease
  assistant:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demo/requirements-agent.txt
      - name: Test Assistant boundaries and SDK adapter (no inference)
        run: |
          python -m pip install -r demo/requirements-agent.txt
          python -m unittest demo.agent_test -v
